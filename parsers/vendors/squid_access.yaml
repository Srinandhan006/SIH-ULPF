parser_id: vendor.squid.access
version: 1.0.0
vendor: Squid Cache
product: Squid
description: >
  Squid native access.log format (not CLF): "time.msec elapsed client action/code bytes
  method URL rfc931 peerstatus/peerhost type". http://www.squid-cache.org/Doc/config/logformat/
compat: { envelope: uli.v1, ocsf: ">=1.6 <2" }
signatures:
  - kind: regex
    pattern: '^\d{10}\.\d{3}\s+\d+\s+\d{1,3}(?:\.\d{1,3}){3}\s+[A-Z_]+/\d{3}\s+\d+\s+[A-Z]+\s+\S+'
    required: true
extract:
  - kind: regex
    field: raw
    pattern: '^(?P<ts_epoch>\d{10}\.\d{3})\s+(?P<elapsed_ms>\d+)\s+(?P<client_ip>\d{1,3}(?:\.\d{1,3}){3})\s+(?P<action>[A-Z_]+)/(?P<status>\d{3})\s+(?P<bytes>\d+)\s+(?P<method>[A-Z]+)\s+(?P<url>\S+)\s+(?P<rfc931>\S+)\s+(?P<peer>[A-Z_]+)/(?P<peerhost>\S+)\s+(?P<content_type>\S+)'
map:
  class_uid: 4002
  activity_id: 1
  fields:
    time: { from: ts_epoch, type: ts }
    src_endpoint.ip: { from: client_ip }
    http_request.http_method: { from: method }
    url.text: { from: url }
    http_response.code: { from: status, type: int }
    http_response.length: { from: bytes, type: int }
    duration: { from: elapsed_ms, type: int }
    proxy.action: { from: action }
    proxy.peer: { from: peerhost }
  unmapped: keep
confidence:
  base: 0.9
  require: [client_ip, url]
