apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uli-data
  namespace: uli
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uli-api
  namespace: uli
spec:
  replicas: 1
  selector: {matchLabels: {app: uli-api}}
  template:
    metadata: {labels: {app: uli-api}}
    spec:
      containers:
        - name: api
          image: uli-api:latest
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: uli-config}}]
          env: [{name: ULI_MODE, value: "distributed"}]
          ports: [{containerPort: 8080}]
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: desired-state, mountPath: /app/deployment/desired-state.yaml, subPath: desired-state.yaml}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 10, periodSeconds: 20}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: uli-data}}
        - {name: desired-state, configMap: {name: uli-desired-state}}
---
apiVersion: v1
kind: Service
metadata:
  name: uli-api
  namespace: uli
spec:
  selector: {app: uli-api}
  ports: [{port: 8080, targetPort: 8080}]
  type: ClusterIP
