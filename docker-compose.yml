name: uli

x-common-env: &common-env
  ULI_DATA_DIR: /app/data
  ULI_LOG_LEVEL: ${ULI_LOG_LEVEL:-INFO}
  ULI_LOG_JSON: "true"
  ULI_DB_URL: ${ULI_DB_URL:-}
  ULI_QUEUE_BACKEND: ${ULI_QUEUE_BACKEND:-auto}
  ULI_REDIS_URL: redis://redis:6379/0
  ULI_AUTH: ${ULI_AUTH:-none}
  ULI_API_KEYS: ${ULI_API_KEYS:-}
  ULI_ML_ENABLED: ${ULI_ML_ENABLED:-false}
  ULI_ML_URL: http://ml:8090

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    restart: unless-stopped

  api:
    build: {context: ., dockerfile: deployment/docker/Dockerfile.api}
    environment:
      <<: *common-env
      ULI_MODE: local
      ULI_API_PORT: "8080"
    ports: ["8080:8080"]
    volumes: ["uli-data:/app/data", "./parsers/vendors:/app/parsers/vendors:ro", "./deployment/desired-state.yaml:/app/deployment/desired-state.yaml:ro"]
    depends_on: {redis: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "curl", "-sf", "http://localhost:8080/health"], interval: 10s, timeout: 3s, retries: 10, start_period: 5s}
    restart: unless-stopped

  worker:
    build: {context: ., dockerfile: deployment/docker/Dockerfile.worker}
    environment:
      <<: *common-env
      ULI_MODE: distributed
    volumes: ["uli-data:/app/data", "./parsers/vendors:/app/parsers/vendors:ro", "./deployment/desired-state.yaml:/app/deployment/desired-state.yaml:ro"]
    depends_on: {redis: {condition: service_healthy}}
    deploy: {replicas: 2}
    restart: unless-stopped

  ml:
    build: {context: ., dockerfile: deployment/docker/Dockerfile.ml}
    profiles: ["ml"]
    environment: {ULI_LOG_LEVEL: "INFO", ULI_LOG_JSON: "true"}
    ports: ["8090:8090"]
    volumes: ["uli-ml-models:/app/models"]
    restart: unless-stopped

  collector:
    build: {context: ., dockerfile: deployment/docker/Dockerfile.collector}
    profiles: ["collector"]
    environment: {ULI_API_URL: "http://api:8080"}
    ports: ["5514:5514/udp", "5514:5514/tcp"]
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped

volumes:
  uli-data: {}
  uli-ml-models: {}
